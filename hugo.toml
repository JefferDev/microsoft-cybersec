baseURL = "https://jefferdev.github.io/microsoft-cybersec/"
canonifyURLs = true
relativeURLs = false

title = "Microsoft Cybersecurity Blog"
defaultContentLanguage = "es"
enableEmoji = true
theme = ["PaperMod"]



[languages]
  [languages.es]
    languageName = "Español"
    languageCode = "es"
    weight = 1

[params.profileMode]
enabled = false

[params.homeInfoParams]
  Title = "Microsoft Cybersecurity Blog"
  Content = """
👋 Bienvenido. Público laboratorios y procedimientos de ciberseguridad enfocados en **Microsoft Entra ID**, **Intune**, **Microsoft Purview**, **Defender** y **Azure**.

{{< tip >}}
Mi objetivo: Documentar procedimientos técnicos sobre las soluciones de seguridad de Microsoft 365, con enfoque práctico, reproducible y orientado a implementación.
{{< /tip >}}

### Qué vas a encontrar aquí

  - Guías paso a paso (labs) y troubleshooting
  - Buenas prácticas de arquitectura (Zero Trust / identidad híbrida)
  - Automatización con PowerShell (Intune, Entra, Purview, MDE)
  - Plantillas reutilizables para despliegues

"""


[params]
  author = "Jefferson Castiblanco"
  description = "Laboratorios reales de ciberseguridad en Microsoft 365"
  avatar = "/static/img/authors/jefferson.jpg"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = true
  ShowToc = true
  TocOpen = true

[[menu.main]]
  name = "Posts"
  url = "posts/"
  weight = 10

[[menu.main]]
  name = "Búsqueda"
  url = "search/"
  weight = 20

[[menu.main]]
  name = "Acerca"
  url = "about/"
  weight = 30


[outputs]
  home = ["HTML", "RSS", "JSON"]

